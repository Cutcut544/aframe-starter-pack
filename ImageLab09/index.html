<!DOCTYPE html>
<html>

<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
</head>

<body>
  <a-scene>
    <a-box position="0 5 -5" width="10" height="1" rotation="0 0 0" color="#FFFFFF"></a-box>
    <a-sphere position="0 2.7 -3" radius="0.35" color="#FFFFFF"></a-sphere>
    <a-sphere position="0 2 -3" radius="0.5" color="#FFFFFF"></a-sphere>
    <a-sphere position="0 1 -3" radius=".75" color="#FFFFFF"></a-sphere>
    <a-cylinder position="1 0.75 -5" radius="0.5" height="8" color="#FFFFFF"></a-cylinder>
    <a-cylinder position="-1 0.75 -5" radius="0.5" height="8" color="#FFFFFF"></a-cylinder>
    <a-cylinder position="-3 0.75 -5" radius="0.5" height="8" color="#FFFFFF"></a-cylinder>
    <a-cylinder position="3 0.75 -5" radius="0.5" height="8" color="#FFFFFF"></a-cylinder>
    <a-sphere position="-.1 2.7 -2.65" radius="0.05" color="#000"></a-sphere>
    <a-sphere position="0.1 2.7 -2.65" radius="0.05" color="#000"></a-sphere>
    <a-cylinder position="0 3 -3" radius="0.4" height="0.05" color="black"></a-cylinder>
    <a-cylinder position="0 3.5 -3" radius="0.3" height="1" color="black"></a-cylinder>
    <a-cone position="0 2.6 -2.6" rotation="90 0 0" radius-bottom="0.07" radius-top="0" height=".3"
      color="orange"></a-cone>
    <a-box position="-.75 1.7 -3" width="0.07" depth="0.03" rotation="0 0 -45" height="1" color="brown"></a-box>
    <a-box position=".75 1.7 -3" width="0.07" depth="0.03" rotation="0 0 45" height="1" color="brown"></a-box>
    <a-plane position="0 0.1 -4" rotation="-90 0 0" width="1" height="20" color="red"></a-plane>
    <!-- <a-sky color="#ECECEC"></a-sky> -->
    <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
    <a-entity environment="preset: tron; dressingAmount: 500"></a-entity>
  </a-scene>
</body>

</html>
